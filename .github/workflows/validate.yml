name: Validate and package
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}', components: 'rustfmt, clippy' }
      - run: npm ci
      - run: npm run build:web
      - run: cargo fmt --package xfold --check
      - run: cargo clippy --locked --no-deps --all-targets -- -D warnings
      - run: cargo test --locked --lib --tests
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Collect notices and prepare platform package
        shell: bash
        run: |
          node scripts/collect-licenses.mjs
          if [[ '${{ matrix.platform }}' == win32-* ]]; then suffix='.exe'; else suffix=''; fi
          XFOLD_PLATFORM='${{ matrix.platform }}' XFOLD_BINARY="target/${{ matrix.target }}/release/xfold${suffix}" node scripts/package-native.mjs
          npm pack --pack-destination artifacts
          cd artifacts/packages/${{ matrix.platform }}
          npm pack
      - name: Install and run packed artifact offline on native hosts
        shell: bash
        run: |
          actual=$(node -p 'process.platform + "-" + process.arch')
          if [[ "$actual" == '${{ matrix.platform }}' ]]; then
            node scripts/smoke-package.mjs artifacts/xfold-cli-0.1.0.tgz
          else
            echo 'Cross-compiled artifact: runtime smoke requires its native host.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xfold-${{ matrix.platform }}
          path: |
            artifacts/*.tgz
            artifacts/packages/*/*.tgz
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:web && cargo build --release --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node --test tests/launcher.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-evidence, path: 'artifacts/' }
